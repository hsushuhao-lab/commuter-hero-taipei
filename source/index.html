<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>《08點上班大作戰：通勤英雄篇》象山晨衝・奔向松德</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0e17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft JhengHei", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas {
      display: block;
      background-color: #101826;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      image-rendering: auto;
    }
    #orientationWarning {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0e17;
      color: #ffd54f;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      z-index: 9999;
      font-size: 18px;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      #orientationWarning { display: flex; }
    }
  </style>
</head>
<body>
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>
    <div id="orientationWarning">
      <div style="font-size: 48px; margin-bottom: 12px;">📱 ↻</div>
      <h2>請旋轉手機為橫向螢幕</h2>
      <p style="margin-top: 8px; color: #b0bec5; font-size: 14px;">以獲得最佳橫向卷軸通勤跑酷體驗</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
