name: v9.9.0 dual mood menu patch

on:
  push:
    paths:
      - '.github/workflows/v990_mode_menu.yml'

permissions:
  contents: write

jobs:
  patch-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v9.9.0 mode menu patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          p = Path('source/src/main.js')
          text = p.read_text(encoding='utf-8')
          def one(pattern, replacement, label, flags=0):
              global text
              text2, n = re.subn(pattern, replacement, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f'{label}: match count {n}')
              text = text2
              print('PASS', label)
          one(r'const GAME_BUILD_VERSION = "v9\.8\.5";', 'const GAME_BUILD_VERSION = "v9.9.0";', 'runtime version')
          one(r'status: "PRODUCTION_VERIFIED"', 'status: "PI_REVIEW_REQUIRED"', 'runtime status')
          old_ctor = "    this.selectedCharId = 'yu';\n    this.instructionsOpen = false;"
          new_ctor = "    this.selectedCharId = 'yu';\n    // v9.9.0 Dual Mood: v9.8.5 remains the immutable Hard-Core baseline.\n    this.difficultyMode = 'hardcore';\n    if (typeof window !== 'undefined') window.__GAME_MODE__ = 'HARDCORE';\n    this.instructionsOpen = false;"
          if text.count(old_ctor) != 1:
              raise SystemExit('constructor anchor mismatch')
          text = text.replace(old_ctor, new_ctor, 1)
          menu = base64.b64decode('').decode('utf-8')
          one(r"    // Main Menu Flow\n    if \(this\.state === 'MENU'\) \{.*?\n      return;\n    \}\n\n    // Character Select Flow", menu, 'menu pointer flow', re.S)
          mode = base64.b64decode('').decode('utf-8')
          if text.count("  startGame() {\n    this.state = 'PLAYING';") != 1:
              raise SystemExit('startGame anchor mismatch')
          text = text.replace("  startGame() {\n    this.state = 'PLAYING';", mode, 1)
          render = base64.b64decode(' 集').decode('utf-8')
          one(r"  renderMenu\(\) \{.*?\n  \}\n\n  renderSelect\(\) \{", render, 'render mode menu', re.S)
          anchor = "    ctx.fillText('寫實立繪與高解析 Q 版 Chibi 對比・每位英雄具備專屬小招與 Anime 大招', this.vw / 2, 75);"
          badge = anchor + "\n\n    ctx.textAlign = 'right';\n    ctx.fillStyle = this.difficultyMode === 'chill' ? '#80CBC4' : '#FF8A80';\n    ctx.font = 'bold 12px sans-serif';\n    ctx.fillText(this.difficultyMode === 'chill' ? '☕ CHILL MOOD' : '🔥 HARD-CORE', 925, 28);\n    ctx.textAlign = 'center';"
          if text.count(anchor) != 1:
              raise SystemExit('character select badge anchor mismatch')
          text = text.replace(anchor, badge, 1)
          p.write_text(text, encoding='utf-8')
          bp = Path('scripts/build_single_file.py')
          b = bp.read_text(encoding='utf-8')
          if b.count('BUILD_VERSION = "v9.8.5"') != 1 or b.count('status: "PRODUCTION_VERIFIED",') != 1:
              raise SystemExit('build metadata anchor mismatch')
          b = b.replace('BUILD_VERSION = "v9.8.5"', 'BUILD_VERSION = "v9.9.0"', 1)
          b = b.replace('status: "PRODUCTION_VERIFIED",', 'status: "PI_REVIEW_REQUIRED",', 1)
          b = b.replace('({BUILD_VERSION} Gameplay Polish)', '({BUILD_VERSION} Dual Mood Preview)', 1)
          bp.write_text(b, encoding='utf-8')
          rp = Path('README.md')
          r = rp.read_text(encoding='utf-8')
          r = r.replace('v9.8.5 正式版', 'v9.9.0 Dual Mood Preview', 1)
          marker = '一款以台北晨間通勤為舞台的 Q 版 2D 橫向動作遊戲。從象山出發，在 08:00 前突破通勤怪獸與雙階段「夢影巨花王」，選擇速度、火力與技能定位各異的三位英雄，最後衝進松德院區完成三人打卡。\n'
          note = '\n> **v9.9.0 開發中：Dual Mood Edition**\n> 主畫面已新增 `☕ Chill Mood` 與 `🔥 Hard-Core` 模式入口。Hard-Core 完整繼承已驗收的 v9.8.5 gameplay；本次先完成模式選單與 runtime mode state，Chill 的實際難度 modifiers 尚未套用。\n'
          if marker not in r:
              raise SystemExit('README anchor mismatch')
          r = r.replace(marker, marker + note, 1)
          rp.write_text(r, encoding='utf-8')
          print('PATCH PASS')
          PY

      - name: Regression gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path('source/src/main.js').read_text(encoding='utf-8')
          c=Path('source/src/data/Characters.js').read_text(encoding='utf-8')
          b=Path('source/src/data/Monsters.js').read_text(encoding='utf-8')
          p=Path('source/src/entities/Player.js').read_text(encoding='utf-8')
          assert 'const GAME_BUILD_VERSION = "v9.9.0";' in m
          assert 'status: "PI_REVIEW_REQUIRED"' in m
          assert "this.selectGameMode('chill')" in m and "this.selectGameMode('hardcore')" in m
          assert '☕ Chill Mood' in m and '🔥 Hard-Core' in m and '__GAME_MODE__' in m
          assert 'game.boss.entranceTriggered' in p
          assert 'for (let wave = 0; wave < 3; wave++)' in p and 'for (let index = 0; index < 7; index++)' in p
          assert '[this.player.id, ...this.companions.map(comp => comp.id)]' in m
          for t in ['speed: 370','speed: 345','speed: 320','skillCooldown: 0.10','skillCooldown: 0.40','ultCooldown: 6.0','ultCooldown: 7.5','damage: 18','damage: 40','damage: 60','damage: 516','damage: 483','damage: 560']:
              assert t in c, t
          assert 'phase1Hp: 3600' in b and 'phase2Hp: 3050' in b
          print('HARD-CORE V9.8.5 BASELINE PASS')
          PY

      - name: Build and verify
        run: |
          python3 scripts/build_single_file.py
          cmp -s index.html dist/index.html
          grep -q 'v9.9.0' index.html
          grep -q 'PI_REVIEW_REQUIRED' index.html
          grep -q 'Chill Mood' index.html
          grep -q 'Hard-Core' index.html
          grep -q '__GAME_MODE__' index.html
          sha256sum index.html dist/index.html > SHA256.txt
          mkdir -p QA_V9_9_0
          cat > QA_V9_9_0/MODE_MENU_QA.json <<'EOF'
          {
            "version": "v9.9.0",
            "status": "PI_REVIEW_REQUIRED",
            "scope": "DUAL_MOOD_MENU_STAGE_1",
            "chill_menu_entry": "PASS",
            "hardcore_menu_entry": "PASS",
            "runtime_mode_state": "PASS",
            "character_select_mode_badge": "PASS",
            "hardcore_v9_8_5_balance_unchanged": "PASS",
            "shakira_v9_8_5_fix_retained": "PASS",
            "three_hero_victory_fix_retained": "PASS",
            "root_dist_parity": "PASS",
            "chill_gameplay_modifiers": "NOT_YET_APPLIED",
            "manual_browser_pi_review": "REQUIRED"
          }
          EOF
          cat SHA256.txt

      - name: Commit candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md QA_V9_9_0 source scripts index.html dist/index.html SHA256.txt
          git diff --cached --check
          git commit -m 'feat(v9.9.0): add Chill Mood and Hard-Core menu'
          git push origin HEAD:main
