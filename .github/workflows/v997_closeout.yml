name: v9.9.7 PI Accepted Frozen Closeout

on:
  push:
    paths:
      - '.github/workflows/v997_closeout.yml'

permissions:
  contents: write

jobs:
  closeout-build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v9.9.7 closeout metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          main_path = Path('source/src/main.js')
          main = main_path.read_text(encoding='utf-8')
          main = main.replace('status: "PI_REVIEW_REQUIRED"', 'status: "PI_ACCEPTED_FROZEN"', 1)
          main_path.write_text(main, encoding='utf-8')

          build_path = Path('scripts/build_single_file.py')
          build = build_path.read_text(encoding='utf-8')
          build = build.replace('status: "PI_REVIEW_REQUIRED"', 'status: "PI_ACCEPTED_FROZEN"', 1)
          build_path.write_text(build, encoding='utf-8')

          qa_path = Path('QA_V9_9_7/REFERENCE_MENU_MATCH_QA.json')
          qa = json.loads(qa_path.read_text(encoding='utf-8'))
          qa['status'] = 'PI_ACCEPTED_FROZEN'
          qa['manual_browser_pi_review'] = 'PASS'
          qa['pi_accepted_date'] = '2026-09-16'
          qa['project_closeout'] = 'PASS'
          qa['frozen_baseline'] = 'v9.9.7'
          qa_path.write_text(json.dumps(qa, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          marker = '> **v9.9.7 Reference Menu Match**：依 PI 核准主畫面參考圖重繪首頁 runtime UI；兩列按鈕改為參考圖比例、霓虹玻璃漸層、圖示圓章與右側箭頭。背景 keyart 與 v9.9.6 gameplay / Boss / HUD / Victory 全部維持不變。\n'
          closeout = marker + '\n> **✅ PROJECT CLOSEOUT — 2026-09-16**：PI 已完成實機驗收並正式接受 v9.9.7。狀態：`PI_ACCEPTED_FROZEN`。本版為最終穩定基線；除非另開新版本，首頁、美術、gameplay、Boss、HUD、balance 與 Victory 均不再變更。\n'
          if 'PROJECT CLOSEOUT — 2026-09-16' not in readme:
              assert marker in readme
              readme = readme.replace(marker, closeout, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Closeout regression gates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          main = Path('source/src/main.js').read_text(encoding='utf-8')
          build = Path('scripts/build_single_file.py').read_text(encoding='utf-8')
          qa = json.loads(Path('QA_V9_9_7/REFERENCE_MENU_MATCH_QA.json').read_text(encoding='utf-8'))
          assert 'const GAME_BUILD_VERSION = "v9.9.7";' in main
          assert 'status: "PI_ACCEPTED_FROZEN"' in main
          assert 'BUILD_VERSION = "v9.9.7"' in build
          assert 'status: "PI_ACCEPTED_FROZEN"' in build
          assert qa['status'] == 'PI_ACCEPTED_FROZEN'
          assert qa['manual_browser_pi_review'] == 'PASS'
          assert qa['project_closeout'] == 'PASS'
          assert qa['frozen_baseline'] == 'v9.9.7'
          # Accepted gameplay/UI invariants remain present.
          for token in ['this.bossBattleCameraX = 14800', 'this.bossBattleZoom = 0.82', 'lockBossBattleCamera()', 'window.__VISIBLE_HERO_IDS__ = [this.player.id];']:
              assert token in main, token
          chars = Path('source/src/data/Characters.js').read_text(encoding='utf-8')
          for token in ['maxHp: 100', 'maxHp: 110', 'maxHp: 120', 'damage: 516', 'damage: 483', 'damage: 560']:
              assert token in chars, token
          print('V9.9.7 CLOSEOUT REGRESSION PASS')
          PY

      - name: Rebuild canonical frozen bundle
        run: |
          python3 scripts/build_single_file.py
          cmp -s index.html dist/index.html
          grep -q 'v9.9.7' index.html
          grep -q 'PI_ACCEPTED_FROZEN' index.html
          sha256sum index.html dist/index.html > SHA256.txt
          test "$(awk '{print $1}' SHA256.txt | uniq | wc -l)" -eq 1
          cat SHA256.txt

      - name: Commit frozen closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md source/src/main.js scripts/build_single_file.py index.html dist/index.html SHA256.txt QA_V9_9_7/REFERENCE_MENU_MATCH_QA.json
          git diff --cached --check
          git commit -m 'chore(v9.9.7): freeze PI-accepted final release'
          git push origin HEAD:main
